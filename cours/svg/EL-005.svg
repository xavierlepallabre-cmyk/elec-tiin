ize="10.5" font-style="italic" font-family="Lexend, Arial, Helvetica, sans-serif">AU : à accrochage, prioritaire ;</text><text x="225.4" y="138" text-anchor="start" dominant-baseline="central" fill="#000000" stroke="none" stroke-width="1" font-size="10.5" font-style="italic" font-family="Lexend, Arial, Helvetica, sans-serif">il reste enfoncé jusqu'au</text><text x="225.4" y="149.5" text-anchor="start" dominant-baseline="central" fill="#000000" stroke="none" stroke-width="1" font-size="10.5" font-style="italic" font-family="Lexend, Arial, Helvetica, sans-serif">déverrouillage volontaire.</text><text x="225.4" y="195.5" text-anchor="start" dominant-baseline="central" fill="#000000" stroke="none" stroke-width="1" font-size="10.5" font-style="italic" font-family="Lexend, Arial, Helvetica, sans-serif">S1 : arrêt normal,</text><text x="225.4" y="207" text-anchor="start" dominant-baseline="central" fill="#000000" stroke="none" stroke-width="1" font-size="10.5" font-style="italic" font-family="Lexend, Arial, Helvetica, sans-serif">il revient seul au repos.</text><text x="225.4" y="407.1" text-anchor="start" dominant-baseline="central" fill="#000000" stroke="none" stroke-width="1" font-size="10.5" font-style="italic" font-family="Lexend, Arial, Helvetica, sans-serif">Ni AU ni S1 ne sont</text><text x="225.4" y="418.6" text-anchor="start" dominant-baseline="central" fill="#000000" stroke="none" stroke-width="1" font-size="10.5" font-style="italic" font-family="Lexend, Arial, Helvetica, sans-serif">des organes de sectionnement.</text></g></svg>