<svg viewBox="0 0 469 258" xmlns="http://www.w3.org/2000/svg" version="1.1" width="102.0mm" height="56.1mm"><title>Lecture de la plaque signalétique et choix du couplage</title><desc>EL-034 — contacts au repos — © 2026 Xavier Le Pallabre — Élec TIIN — CC BY-NC-SA 4.0. Échelle 1:1 (1 cm du schéma = 1 cm imprimé).</desc><g><rect x="18.4" y="18.4" width="184" height="147.20000000000002" fill="none" stroke="#000000" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="253" y="119.6" width="138" height="92" fill="none" stroke="#000000" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><polyline points="276,188.6 322,142.6" fill="none" stroke="#000000" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><polyline points="322,188.6 368,142.6" fill="none" stroke="#000000" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><polyline points="368,188.6 276,142.6" fill="none" stroke="#000000" stroke-width="1.3" stroke-dasharray="5 4"/><rect x="271.4" y="138" width="101.19999999999996" height="9.200000000000001" rx="3.68" fill="#000000" stroke="none" stroke-width="1"/></g><g><text x="110.4" y="31.3" text-anchor="middle" dominant-baseline="central" fill="#000000" stroke="none" stroke-width="1" font-size="15" font-weight="700" font-family="Lexend, Arial, Helvetica, sans-serif">Plaque signalétique</text><text x="32.2" y="50.6" text-anchor="start" dominant-baseline="central" fill="#000000" stroke="none" stroke-width="1" font-size="13" font-weight="700" font-family="Lexend, Arial, Helvetica, sans-serif">MOT. 3 ~   50 Hz</text><text x="32.2" y="69.9" text-anchor="start" dominant-baseline="central" fill="#000000" stroke="none" stroke-width="1" font-size="13" font-weight="700" font-family="Lexend, Arial, Helvetica, sans-serif">1,5 kW   cos φ 0,82</text><text x="32.2" y="89.2" text-anchor="start" dominant-baseline="central" fill="#000000" stroke="none" stroke-width="1" font-size="13" font-weight="700" font-family="Lexend, Arial, Helvetica, sans-serif">1425 tr/min</text><text x="32.2" y="108.6" text-anchor="start" dominant-baseline="central" fill="#000000" stroke="none" stroke-width="1" font-size="13" font-weight="700" font-family="Lexend, Arial, Helvetica, sans-serif">Δ 230 V   5,9 A</text><text x="32.2" y="127.9" text-anchor="start" dominant-baseline="central" fill="#000000" stroke="none" stroke-width="1" font-size="13" font-weight="700" font-family="Lexend, Arial, Helvetica, sans-serif">Y 400 V   3,4 A</text><text x="32.2" y="147.2" text-anchor="start" dominant-baseline="central" fill="#000000" stroke="none" stroke-width="1" font-size="13" font-weight="700" font-family="Lexend, Arial, Helvetica, sans-serif">IP 55   classe F</text><text x="230" y="32.2" text-anchor="start" dominant-baseline="central" fill="#000000" stroke="none" stroke-width="1" font-size="15" font-weight="700" font-family="Lexend, Arial, Helvetica, sans-serif">Réseau 3 × 400 V</text><text x="230" y="50.6" text-anchor="start" dominant-baseline="central" fill="#000000" stroke="none" stroke-width="1" font-size="10.5" font-style="italic" font-family="Lexend, Arial, Helvetica, sans-serif">Chaque enroulement supporte 230 V :</text><text x="230" y="64.4" text-anchor="start" dominant-baseline="central" fill="#000000" stroke="none" stroke-width="1" font-size="10.5" font-style="italic" font-family="Lexend, Arial, Helvetica, sans-serif">en étoile, il reçoit 400 / √3 ≈ 230 V.</text><text x="230" y="78.2" text-anchor="start" dominant-baseline="central" fill="#000000" stroke="none" stroke-width="1" font-size="10.5" font-style="italic" font-family="Lexend, Arial, Helvetica, sans-serif">→ couplage étoile, courant de ligne 3,4 A.</text><circle cx="276" cy="188.6" r="3.4" fill="#ffffff" stroke="#000000" stroke-width="1.5"/><text x="276" y="179.4" text-anchor="middle" dominant-baseline="central" fill="#000000" stroke="none" stroke-width="1" font-size="11" font-family="Lexend, Arial, Helvetica, sans-serif">U1</text><circle cx="322" cy="188.6" r="3.4" fill="#ffffff" stroke="#000000" stroke-width="1.5"/><text x="322" y="179.4" text-anchor="middle" dominant-baseline="central" fill="#000000" stroke="none" stroke-width="1" font-size="11" font-family="Lexend, Arial, Helvetica, sans-serif">V1</text><circle cx="368" cy="188.6" r="3.4" fill="#ffffff" stroke="#000000" stroke-width="1.5"/><text x="368" y="179.4" text-anchor="middle" dominant-baseline="central" fill="#000000" stroke="none" stroke-width="1" font-size="11" font-family="Lexend, Arial, Helvetica, sans-serif">W1</text><circle cx="276" cy="142.6" r="3.4" fill="#ffffff" stroke="#000000" stroke-width="1.5"/><text x="276" y="133.4" text-anchor="middle" dominant-baseline="central" fill="#000000" stroke="none" stroke-width="1" font-size="11" font-family="Lexend, Arial, Helvetica, sans-serif">W2</text><circle cx="322" cy="142.6" r="3.4" fill="#ffffff" stroke="#000000" stroke-width="1.5"/><text x="322" y="133.4" text-anchor="middle" dominant-baseline="central" fill="#000000" stroke="none" stroke-width="1" font-size="11" font-family="Lexend, Arial, Helvetica, sans-serif">U2</text><circle cx="368" cy="142.6" r="3.4" fill="#ffffff" stroke="#000000" stroke-width="1.5"/><text x="368" y="133.4" text-anchor="middle" dominant-baseline="central" fill="#000000" stroke="none" stroke-width="1" font-size="11" font-family="Lexend, Arial, Helvetica, sans-serif">V2</text><text x="230" y="227.7" text-anchor="start" dominant-baseline="central" fill="#000000" stroke="none" stroke-width="1" font-size="10.5" font-style="italic" font-family="Lexend, Arial, Helvetica, sans-serif">Sur un réseau 3 × 230 V, le même moteur</text><text x="230" y="241.5" text-anchor="start" dominant-baseline="central" fill="#000000" stroke="none" stroke-width="1" font-size="10.5" font-style="italic" font-family="Lexend, Arial, Helvetica, sans-serif">se couple en triangle (5,9 A).</text></g></svg>